<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MADEGRO Beheer</title>
<link rel="icon" href="assets/favicon/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   MADEGRO Beheer: het casebeheer achter de Admin-link in de voet van de site.
   Eén bestand. De cases staan in Supabase (tabel `posts`) en worden via de
   REST-API gelezen en geschreven met fetch(); er is geen lokale opslag.
   ========================================================================== */
:root {
  --color-groen: #017E84;
  --color-groen-diep: #01575B;
  --color-groen-diepst: #014144;
  --color-geel: #FFFC58;
  --color-geel-hover: #F2EE3E;
  --color-white: #ffffff;
  --color-grey: #f1f1f1;
  --color-grey-diep: #d7d7d7;
  --color-heading: var(--color-groen-diepst);
  --color-text-primary: var(--color-groen-diepst);
  --color-accent: var(--color-geel);
  --color-background: var(--color-white);
  --color-fout: #B3261E;

  --font: "Inter Tight", "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --inset-x: clamp(16px, 4vw, 48px);
  --container: 1240px;
  --radius-pill: 100px;
  --duur: 180ms;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100svh;
  font-family: var(--font); font-weight: 400; font-size: 17px; line-height: 1.55;
  color: var(--color-text-primary); background: var(--color-background);
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 300; line-height: 1.1; color: var(--color-heading); }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--color-groen); outline-offset: 3px; }
.visueel-verborgen { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
.app__main { flex: 1 0 auto; }
.container { max-width: var(--container); margin-inline: auto; padding-inline: var(--inset-x); }

.label { display: block; font-size: 12px; font-weight: 500; letter-spacing: 2.2px; text-transform: uppercase; color: var(--color-groen); line-height: 1.4; }
.kop-l { font-size: clamp(1.9rem, 1.4rem + 2vw, 3rem); }
.kop-m { font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); }

/* Knoppen: pillen. Primair geel met zwarte tekst, secundair wit met groene rand. */
.knop {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 26px; border-radius: var(--radius-pill); border: 1.5px solid transparent;
  font-size: 13px; font-weight: 500; letter-spacing: 2.2px; text-transform: uppercase;
  text-decoration: none; line-height: 1; white-space: nowrap;
  transition: background-color var(--duur), border-color var(--duur), color var(--duur), opacity var(--duur);
}
.knop--primair { background: var(--color-geel); color: #000; }
.knop--primair:hover { background: var(--color-geel-hover); }
.knop--secundair { background: var(--color-white); color: var(--color-groen-diepst); border-color: var(--color-groen); }
.knop--secundair:hover { background: var(--color-grey); }
.knop--klein { padding: 9px 16px; font-size: 11px; letter-spacing: 1.8px; }
.knop--gevaar { border-color: var(--color-fout); color: var(--color-fout); }
.knop--gevaar:hover { background: #fbeeed; }
.knop--tekst { background: none; border: 0; padding: 0; text-transform: none; letter-spacing: 0; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.knop--pijl::after { content: "\2192"; font-size: 15px; letter-spacing: 0; }
.knop[disabled], .knop[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }

/* Kopbalk */
.balk { border-bottom: 1px solid var(--color-grey-diep); background: var(--color-grey); }
.balk__inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 76px; flex-wrap: wrap; padding-block: 12px; }
.woordmerk { display: inline-flex; flex-direction: column; text-decoration: none; line-height: 1; }
.woordmerk__naam { font-size: 26px; font-weight: 500; letter-spacing: 3px; color: var(--color-groen); }
.woordmerk__sub { font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--color-groen-diep); margin-top: 6px; }
.balk__links { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; }
.balk__links a { text-decoration: none; }
.balk__links a:hover { text-decoration: underline; text-underline-offset: 4px; }

/* Voet: dezelfde vier items als op de site, netjes afbrekend op smal scherm. */
.voet { background: var(--color-groen-diepst); color: var(--color-white); }
.voet__inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px; padding-block: 22px; font-size: 14px; line-height: 1.5; }
.voet__inner a { color: var(--color-white); text-decoration: none; }
.voet__inner a:hover { text-decoration: underline; text-underline-offset: 4px; }

/* Inloggen */
.inlog { max-width: 420px; margin: clamp(48px, 10vw, 120px) auto; padding-inline: var(--inset-x); }
.inlog h1 { margin: 12px 0 28px; }
.fout { color: var(--color-fout); font-size: 15px; margin-top: 12px; min-height: 1.5em; }

/* Velden */
.veld { display: grid; gap: 8px; }
.veld label, .veldlabel { font-size: 12px; font-weight: 500; letter-spacing: 2.2px; text-transform: uppercase; color: var(--color-groen-diep); }
.veld input[type="text"], .veld input[type="password"], .veld input[type="date"], .veld select, .veld textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--color-grey-diep); border-radius: 4px;
  background: var(--color-white); color: var(--color-text-primary); font: inherit; font-size: 16px;
  transition: border-color var(--duur);
}
.veld textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.veld input:focus, .veld select:focus, .veld textarea:focus { border-color: var(--color-groen); outline: none; box-shadow: 0 0 0 3px rgba(1,126,132,.15); }
.veld__hint { font-size: 13px; color: var(--color-groen-diep); }
.veld__fout { font-size: 14px; color: var(--color-fout); }
.veld__fout:empty { display: none; }
.veld--fout input { border-color: var(--color-fout); }
.velden { display: grid; gap: 22px; }
.velden--2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.schakel { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; font-size: 15px; }
.schakel input { position: absolute; opacity: 0; width: 0; height: 0; }
.schakel__spoor { width: 46px; height: 26px; border-radius: 13px; background: var(--color-grey-diep); position: relative; transition: background var(--duur); flex: 0 0 auto; }
.schakel__spoor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--color-white); transition: transform var(--duur); }
.schakel input:checked + .schakel__spoor { background: var(--color-groen); }
.schakel input:checked + .schakel__spoor::after { transform: translateX(20px); }
.schakel input:focus-visible + .schakel__spoor { outline: 3px solid var(--color-groen); outline-offset: 3px; }

/* Dashboard */
.admin { padding-block: clamp(32px, 5vw, 64px); }
.admin__kop { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 36px; }
.admin__kop h1 { margin-top: 10px; }
.admin__acties { display: flex; gap: 10px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 40px; }
.stat { background: var(--color-grey); padding: 22px 24px; }
.stat__getal { font-size: 2.6rem; font-weight: 300; line-height: 1; color: var(--color-groen); margin-top: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--color-grey-diep); margin-bottom: 8px; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 16px; font-size: 15px; margin-bottom: -1px; }
.tab[aria-selected="true"] { border-bottom-color: var(--color-groen); font-weight: 500; }
.tab__aantal { display: inline-block; margin-left: 6px; font-size: 12px; background: var(--color-grey); padding: 2px 8px; border-radius: var(--radius-pill); }

.tabel { width: 100%; border-collapse: collapse; }
.tabel th { text-align: left; font-size: 12px; font-weight: 500; letter-spacing: 2.2px; text-transform: uppercase; color: var(--color-groen-diep); padding: 14px 12px; border-bottom: 1px solid var(--color-grey-diep); }
.tabel td { padding: 16px 12px; border-bottom: 1px solid var(--color-grey-diep); vertical-align: middle; }
.tabel td:first-child, .tabel th:first-child { padding-left: 0; }
.tabel td:last-child, .tabel th:last-child { padding-right: 0; }
.tabel__klant { font-weight: 500; }
.tabel__titel { color: var(--color-groen-diep); font-size: 15px; margin-top: 2px; }
.tabel__acties { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.badge { display: inline-block; padding: 5px 12px; border-radius: var(--radius-pill); font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 500; }
.badge--gepubliceerd { background: var(--color-groen); color: var(--color-white); }
.badge--concept { background: var(--color-geel); color: #000; }
.leeg { padding: 48px 0; text-align: center; color: var(--color-groen-diep); }
.melding { font-size: 14px; color: var(--color-groen-diep); min-height: 1.4em; margin-top: 12px; }
.melding--fout { color: var(--color-fout); }
.foutvlak { border: 1.5px solid var(--color-fout); background: #fbeeed; padding: 18px 22px; display: grid; gap: 12px; margin-bottom: 24px; }
.foutvlak p { color: var(--color-fout); }
.bezig { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--color-grey-diep); border-top-color: var(--color-groen); border-radius: 50%; animation: draai .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
@keyframes draai { to { transform: rotate(360deg); } }

@media (max-width: 860px) {
  .tabel thead { display: none; }
  .tabel, .tabel tbody, .tabel tr, .tabel td { display: block; width: 100%; }
  .tabel tr { padding: 18px 0; border-bottom: 1px solid var(--color-grey-diep); }
  .tabel td { border: 0; padding: 4px 0; }
  .tabel td[data-kop]::before { content: attr(data-kop); display: block; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--color-groen-diep); margin-bottom: 2px; }
  .tabel__acties { justify-content: flex-start; padding-top: 10px; }
}

/* Editor: elke sectie een <details>, ingeklapt, met eigen kop. */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.editor__zij { position: sticky; top: 24px; display: grid; gap: 14px; background: var(--color-grey); padding: 24px; }
.sectie { border: 1px solid var(--color-grey-diep); margin-bottom: 12px; background: var(--color-white); }
.sectie > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 18px 22px; }
.sectie > summary::-webkit-details-marker { display: none; }
.sectie__nr { font-size: 12px; letter-spacing: 2.2px; color: var(--color-groen); font-weight: 500; min-width: 2.2em; }
.sectie__kop { font-size: 1.15rem; font-weight: 400; flex: 1; }
.sectie__toestand { font-size: 13px; color: var(--color-groen-diep); }
.sectie > summary::after { content: "+"; font-size: 24px; font-weight: 300; color: var(--color-groen); line-height: 1; }
.sectie[open] > summary::after { content: "\2212"; }
.sectie[open] > summary { border-bottom: 1px solid var(--color-grey-diep); }
.sectie__inhoud { padding: 24px 22px 28px; display: grid; gap: 22px; }
.herhaal { display: grid; gap: 12px; }
.herhaal__rij { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.herhaal__velden { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.herhaal__velden--1 { grid-template-columns: 1fr; }
.herhaal__verwijder { border: 1.5px solid var(--color-grey-diep); background: var(--color-white); border-radius: var(--radius-pill); width: 42px; height: 42px; font-size: 20px; line-height: 1; }
.herhaal__verwijder:hover { border-color: var(--color-fout); color: var(--color-fout); }
.herhaal__verwijder[disabled] { opacity: .35; cursor: not-allowed; }
.voorvertoning { display: grid; gap: 8px; }
.voorvertoning img { max-height: 160px; width: auto; border: 1px solid var(--color-grey-diep); }
.kaartvoorbeeld { border: 1px solid var(--color-grey-diep); background: var(--color-grey); padding: 20px; display: grid; gap: 10px; }
.rij__meta { display: flex; gap: 20px; flex-wrap: wrap; }

@media (max-width: 991px) {
  .editor { grid-template-columns: 1fr; }
  .editor__zij { position: static; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================================
   Instellingen
   ========================================================================== */
const SUPABASE_URL = 'https://ltkqjffncezrtidthbox.supabase.co/rest/v1/';
const SUPABASE_KEY = 'sb_publishable__LAsCC26uaKcwBJdaQvPNw_hNs2t_mP';
const TABEL = 'posts'; // De tabel in Supabase heet posts; de inhoud zijn cases.
const SESSIE_SLEUTEL = 'madegro-cms-ingelogd';
const WACHTWOORD = 'admin123'; // Voorlopig; komt later uit een echte login.
const DIENSTEN = ['Veilig gedrag', 'EHS RIE', 'Safety Checks'];
const SITE = { home: 'index.html', privacy: 'privacybeleid.html', cookies: 'cookies.html' };

/* ============================================================================
   Supabase REST via fetch(). Eén functie voor alle aanroepen: zet de sleutels
   in de headers, controleert response.ok en maakt van een foutantwoord een
   Error met status en de melding van Supabase, zodat de UI die kan tonen.
   ========================================================================== */
class ApiFout extends Error {
  constructor(status, bericht) { super(bericht); this.status = status; }
}

async function api(pad, { methode = 'GET', body, prefer } = {}) {
  const headers = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, Accept: 'application/json' };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (prefer) headers.Prefer = prefer;
  let antwoord;
  try {
    antwoord = await fetch(SUPABASE_URL + pad, { method: methode, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (e) {
    throw new ApiFout(0, 'Geen verbinding met de database (' + e.message + ').');
  }
  if (!antwoord.ok) {
    let bericht = '';
    try {
      const j = await antwoord.json();
      bericht = [j.message, j.details, j.hint].filter(Boolean).join(' ');
    } catch (e) { /* geen JSON in het foutantwoord */ }
    throw new ApiFout(antwoord.status, bericht || `${antwoord.status} ${antwoord.statusText}`);
  }
  if (antwoord.status === 204) return null;
  const tekst = await antwoord.text();
  return tekst ? JSON.parse(tekst) : null;
}

/* Alleen slug, published en content gaan ooit naar de database. */
function payload(c) {
  return { slug: c.slug, published: !!c.published, content: schoonContent(c.content) };
}

const db = {
  alle: () => api(`${TABEL}?select=*`),
  maak: (c) => api(TABEL, { methode: 'POST', body: payload(c), prefer: 'return=representation' }),
  werkBij: (id, velden) => api(`${TABEL}?id=eq.${encodeURIComponent(id)}`, { methode: 'PATCH', body: velden, prefer: 'return=representation' }),
  verwijder: (id) => api(`${TABEL}?id=eq.${encodeURIComponent(id)}`, { methode: 'DELETE', prefer: 'return=representation' }),
};

/* ============================================================================
   Datamodel. Een rij is { id, created_at, slug, published, content }; alle
   inhoud van de case staat in content, precies zoals de kolom is afgesproken.
   ========================================================================== */
function vandaag() { return new Date().toISOString().slice(0, 10); }

function leegContent() {
  return {
    titel: '', klantnaam: '', dienst: DIENSTEN[0], branche: '', locatie: '',
    publicatiedatum: vandaag(),
    hero: { afbeelding: '', alt: '', label: '', ctaPrimair: 'Zelfde vraag? Neem contact op', ctaSecundair: 'Alle cases' },
    kerncijfers: [{ label: '', getal: '', eenheid: '' }, { label: '', getal: '', eenheid: '' }],
    inleiding: '',
    over: { kop: '', body: '' },
    uitdaging: { kop: 'De uitdaging', body: '', lijst: [] },
    citaat: { tonen: true, tekst: '', naam: '', functie: '' },
    aanpak: { kop: 'De aanpak', body: '', lijst: [], afbeelding: '', alt: '' },
    resultaat: { kop: '', body: '' },
    kaart: { samenvatting: '', afbeelding: '', alt: '' },
    gerelateerd: [],
    cta: { label: 'Contact', kop: 'Herken je dit?', tekst: '', knoptekst: 'Neem contact op' },
  };
}

function leegCase() {
  return { id: null, created_at: null, slug: '', published: false, content: leegContent() };
}

/* Vult een rij uit de database aan met alles wat het dashboard en de editor
   verwachten, zodat een half gevulde case nergens breekt. Schrijft niets terug. */
function normaliseer(rij) {
  const b = leegContent();
  const c = (rij && typeof rij.content === 'object' && rij.content) || {};
  const obj = (k) => ({ ...b[k], ...((c[k] && typeof c[k] === 'object') ? c[k] : {}) });
  const lijst = (v) => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
  const content = {
    ...b, ...c,
    hero: obj('hero'), over: obj('over'), uitdaging: obj('uitdaging'), citaat: obj('citaat'),
    aanpak: obj('aanpak'), resultaat: obj('resultaat'), kaart: obj('kaart'), cta: obj('cta'),
    kerncijfers: Array.isArray(c.kerncijfers) ? c.kerncijfers.map(k => ({ label: '', getal: '', eenheid: '', ...(k || {}) })) : [],
    gerelateerd: lijst(c.gerelateerd),
  };
  content.uitdaging.lijst = lijst(content.uitdaging.lijst);
  content.aanpak.lijst = lijst(content.aanpak.lijst);
  content.citaat.tonen = content.citaat.tonen !== false;
  return { id: rij.id, created_at: rij.created_at || null, slug: rij.slug || '', published: !!rij.published, content };
}

/* Wat er wegvalt voordat het de database ingaat: lege punten, lege
   gerelateerde slugs, meer dan vier kerncijfers. */
function schoonContent(content) {
  const c = JSON.parse(JSON.stringify(content));
  c.kerncijfers = (c.kerncijfers || []).slice(0, 4);
  c.uitdaging.lijst = (c.uitdaging.lijst || []).map(s => s.trim()).filter(Boolean);
  c.aanpak.lijst = (c.aanpak.lijst || []).map(s => s.trim()).filter(Boolean);
  c.gerelateerd = (c.gerelateerd || []).filter(Boolean);
  return c;
}

/* ============================================================================
   Toestand
   ========================================================================== */
let cases = [];
let casesGeladen = false;
let laadFout = null;
let laadBezig = null;

async function laadCases() {
  if (laadBezig) return laadBezig;
  laadBezig = (async () => {
    laadFout = null;
    try {
      const rijen = await db.alle();
      cases = (Array.isArray(rijen) ? rijen : []).map(normaliseer);
      casesGeladen = true;
    } catch (e) {
      laadFout = e;
    } finally {
      laadBezig = null;
    }
  })();
  return laadBezig;
}

function datumVan(c) { return c.content.publicatiedatum || (c.created_at || '').slice(0, 10) || ''; }
function gesorteerd(lijst) { return [...lijst].sort((a, b) => datumVan(b).localeCompare(datumVan(a))); }
function vindCase(id) { return cases.find(c => String(c.id) === String(id)); }
function vervangInLijst(rij) {
  const i = cases.findIndex(c => String(c.id) === String(rij.id));
  if (i >= 0) cases[i] = rij; else cases.push(rij);
}

/* ============================================================================
   Hulpfuncties
   ========================================================================== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function slugify(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/&/g, ' en ').replace(/\b(b\.?v\.?|n\.?v\.?|v\.?o\.?f\.?)\b/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function slugVoorKlant(klantnaam) { const s = slugify(klantnaam); return s ? 'case-' + s : ''; }
function autoLabel(content) { return [content.dienst, content.branche].filter(Boolean).join(' · ').toUpperCase(); }
function heeftTekst(s) { return String(s || '').trim().length > 0; }
function datumKort(iso) {
  if (!iso) return '';
  const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
  return isNaN(d) ? iso : new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}
/* Kaartsamenvatting: uit content.kaart.samenvatting, anders ter plekke uit de
   inleiding afgeleid (eerste twee zinnen, hoogstens 160 tekens). Nooit opgeslagen. */
function samenvatting(content) {
  const eigen = (content.kaart?.samenvatting || '').trim();
  if (eigen) return eigen;
  const bron = (content.inleiding || '').replace(/\s+/g, ' ').trim();
  if (!bron) return '';
  const zinnen = bron.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [bron];
  let uit = zinnen.slice(0, 2).map(z => z.trim()).join(' ');
  if (uit.length > 160) uit = uit.slice(0, 157).replace(/\s+\S*$/, '') + '…';
  return uit;
}
function ingelogd() { return sessionStorage.getItem(SESSIE_SLEUTEL) === '1'; }
function foutTekst(e) { return e instanceof ApiFout ? `${e.message}${e.status ? ` (HTTP ${e.status})` : ''}` : (e?.message || String(e)); }

function lees(obj, pad) { return pad.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function schrijf(obj, pad, waarde) {
  const delen = pad.split('.'); let o = obj;
  for (let i = 0; i < delen.length - 1; i++) { if (o[delen[i]] == null) o[delen[i]] = {}; o = o[delen[i]]; }
  o[delen[delen.length - 1]] = waarde;
}

const app = document.getElementById('app');

async function route() {
  const delen = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (!ingelogd()) return renderLogin();
  if (!casesGeladen && !laadFout) { renderLaden(); await laadCases(); }
  if (delen[0] === 'nieuw') return renderEditor(null);
  if (delen[0] === 'bewerk' && delen[1]) return renderEditor(delen[1]);
  return renderDashboard();
}

function exporteerJSON() {
  const data = { formaat: 'madegro-cases', versie: 2, geexporteerd: new Date().toISOString(), cases: cases.map(c => ({ id: c.id, created_at: c.created_at, ...payload(c) })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `madegro-cases-${vandaag()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Importeren maakt nieuwe rijen aan (slug, published, content); id en
   created_at uit het bestand worden genegeerd, die geeft de database zelf. */
function importeerJSON(bestand, melding) {
  const lezer = new FileReader();
  lezer.onload = async () => {
    let lijst;
    try {
      const data = JSON.parse(lezer.result);
      lijst = Array.isArray(data) ? data : data.cases;
      if (!Array.isArray(lijst)) throw new Error();
    } catch (e) { melding('Dit bestand is geen geldige cases-export.', true); return; }
    const bruikbaar = lijst.filter(r => r && typeof r === 'object' && r.content && typeof r.content === 'object');
    if (!bruikbaar.length) { melding('Geen cases met een content-veld gevonden in dit bestand.', true); return; }
    if (!confirm(`${bruikbaar.length} case(s) als nieuwe rijen toevoegen aan de database?`)) return;
    let gelukt = 0; const fouten = [];
    for (const r of bruikbaar) {
      const c = normaliseer({ ...r, id: null });
      if (!c.slug) c.slug = slugVoorKlant(c.content.klantnaam);
      try {
        const rijen = await db.maak(c);
        if (Array.isArray(rijen) && rijen[0]) { vervangInLijst(normaliseer(rijen[0])); gelukt++; }
      } catch (e) {
        fouten.push(`${c.slug || '(zonder slug)'}: ${e.status === 409 ? 'slug al in gebruik' : foutTekst(e)}`);
      }
    }
    renderDashboard();
    const m = document.getElementById('dashmelding');
    if (m) { m.textContent = `${gelukt} case(s) toegevoegd.` + (fouten.length ? ` Mislukt: ${fouten.join('; ')}` : ''); m.classList.toggle('melding--fout', fouten.length > 0); }
  };
  lezer.readAsText(bestand);
}

  return `<div class="veld" ${opties.foutId ? `id="${opties.foutId}-veld"` : ''}><label for="${id}">${esc(label)}</label><input type="${opties.soort || 'text'}" id="${id}" data-pad="${pad}" value="${esc(waarde)}" placeholder="${esc(opties.placeholder || '')}">${fout}${hint}</div>`;

/* Gerelateerde cases worden als slug bewaard: dat is wat de site zelf ook
   gebruikt, en het overleeft een export en import beter dan een id. */
function gerelateerdKeuzes(index) {
  const anderen = gesorteerd(cases.filter(c => c.published && String(c.id) !== String(bewerk.id) && c.slug));
  const keuzes = [['', 'Geen'], ...anderen.map(c => [c.slug, `${c.content.klantnaam || c.slug}: ${c.content.titel || ''}`])];
  return veld(`content.gerelateerd.${index}`, `Gerelateerde case ${index + 1}`, { soort: 'keuze', keuzes });

     wat er in de database staat en geen half bewerkte versie. */
  bewerk = bron ? JSON.parse(JSON.stringify(bron)) : leegCase();
  while (bewerk.content.kerncijfers.length < 2) bewerk.content.kerncijfers.push({ label: '', getal: '', eenheid: '' });

  slugHandmatig = !!bron && bron.slug !== slugVoorKlant(bron.content.klantnaam);
  vorigeKlant = bewerk.content.klantnaam;
  tekenEditor();
}

              ${veld('content.hero.label', 'Label boven de titel', { placeholder: autoLabel(k) || 'DIENST · BRANCHE', hint: 'Leeg = automatisch uit dienst en branche: ' + (autoLabel(k) || '…') })}
              <div class="velden velden--2">
                ${veld('content.hero.ctaPrimair', 'Tekst primaire knop')}
                ${veld('content.hero.ctaSecundair', 'Tekst secundaire knop')}
              </div>
            </div>`, isOpen(2))}

          ${sectie(3, 'Kerncijfers', kerncijferLijst(), isOpen(3), `${k.kerncijfers.length} van 4`)}

          ${sectie(4, 'Inleiding', veld('content.inleiding', 'Lead-tekst', { soort: 'tekstvak', rijen: 4, hint: 'Eén alinea, zonder kop: de aanleiding van het traject. Zonder eigen kaartsamenvatting worden hieruit de eerste twee zinnen gebruikt.' }), isOpen(4))}

          ${sectie(5, 'Over de klant', `
            <div class="velden">
              ${veld('content.over.kop', 'Kop', { placeholder: 'Over ' + (k.klantnaam || '[klantnaam]') })}
              ${veld('content.over.body', 'Bodytekst', { soort: 'tekstvak' })}
            </div>`, isOpen(5))}

          ${sectie(6, 'De uitdaging', `
            <div class="velden">
              ${veld('content.uitdaging.kop', 'Kop')}
              ${veld('content.uitdaging.body', 'Bodytekst', { soort: 'tekstvak' })}
              ${puntenLijst('content.uitdaging.lijst', 'Punten')}
            </div>`, isOpen(6))}

          ${sectie(7, 'Citaat', `
            <div class="velden">
              ${schakel('content.citaat.tonen', 'Citaat tonen op de pagina')}
              ${veld('content.citaat.tekst', 'Citaattekst', { soort: 'tekstvak', rijen: 3 })}
              <div class="velden velden--2">
                ${veld('content.citaat.naam', 'Naam')}
                ${veld('content.citaat.functie', 'Functie en bedrijf', { placeholder: 'KAM-coördinator, Van Deursen Metaal B.V.' })}
              </div>
            </div>`, isOpen(7), k.citaat.tonen ? '' : 'weggelaten')}

          ${sectie(8, 'De aanpak', `
            <div class="velden">
              ${veld('content.aanpak.kop', 'Kop')}
              ${veld('content.aanpak.body', 'Bodytekst', { soort: 'tekstvak' })}
              ${puntenLijst('content.aanpak.lijst', 'Punten')}
              <div class="velden velden--2">
                ${veld('content.aanpak.afbeelding', 'Pad naar sfeerafbeelding (optioneel)', { placeholder: 'assets/foto/productiehal-1024.webp' })}
                ${veld('content.aanpak.alt', 'Alt-tekst')}
              </div>
              ${beeldvoorbeeld('content.aanpak.afbeelding')}
            </div>`, isOpen(8))}

          ${sectie(9, 'Het resultaat', `
            <div class="velden">
              ${veld('content.resultaat.kop', 'Kop', { placeholder: 'Zelfde plek, ander resultaat' })}
              ${veld('content.resultaat.body', 'Bodytekst', { soort: 'tekstvak' })}
            </div>`, isOpen(9))}

          ${sectie(10, 'Kaartweergave', `
            <div class="velden">
              ${veld('content.kaart.samenvatting', 'Korte samenvatting', { soort: 'tekstvak', rijen: 3, hint: 'Maximaal twee zinnen. Leeg = de eerste twee zinnen van de inleiding (wordt niet opgeslagen).' })}
              <div class="velden velden--2">
                ${veld('content.kaart.afbeelding', 'Pad naar kaartafbeelding', { placeholder: 'assets/foto/lassen-640.webp' })}
                ${veld('content.kaart.alt', 'Alt-tekst')}
              </div>
              ${beeldvoorbeeld('content.kaart.afbeelding')}
              <div class="kaartvoorbeeld" aria-label="Voorbeeld van de kaart">
                <div class="rij__meta"><span class="label" data-kaart="dienst">${esc(k.dienst)}</span><span class="label" data-kaart="locatie">${esc(k.locatie)}</span></div>
                <h3 class="kop-m" data-kaart="klant">${esc(k.klantnaam) || '[klantnaam]'}</h3>
                <p data-kaart="samenvatting">${esc(samenvatting(k)) || '[korte samenvatting]'}</p>
              </div>
            </div>`, isOpen(10))}

          ${sectie(11, 'Gerelateerde cases', `
            <div class="velden velden--2">
              ${gerelateerdKeuzes(0)}
              ${gerelateerdKeuzes(1)}
            </div>
            <span class="veld__hint">Alleen gepubliceerde cases zijn te kiezen. Ze verschijnen onderaan de pagina onder “Andere trajecten”.</span>`, isOpen(11))}

          ${sectie(12, 'CTA-blok', `
            <div class="velden">
              <div class="velden velden--2">
                ${veld('content.cta.label', 'Label')}
                ${veld('content.cta.kop', 'Kop', { placeholder: 'Herken je dit?' })}
              </div>
              ${veld('content.cta.tekst', 'Tekst', { soort: 'tekstvak', rijen: 3 })}
              ${veld('content.cta.knoptekst', 'Knoptekst')}
            </div>`, isOpen(12))}
        </div>

        <aside class="editor__zij" aria-label="Opslaan">
          <span class="badge badge--${b.published ? 'gepubliceerd' : 'concept'}" style="justify-self:start">${b.published ? 'gepubliceerd' : 'concept'}</span>
          <button class="knop knop--primair knop--pijl" type="submit" id="opslaanknop">Opslaan</button>
          <button class="knop knop--secundair" type="button" data-actie="opslaan-sluiten">Opslaan en sluiten</button>
          ${!nieuw && b.published && b.slug ? `<a class="knop knop--secundair" href="${esc(b.slug)}.html">Bekijk pagina</a>` : ''}
          <p class="melding" id="editormelding" aria-live="polite">${b.created_at ? 'Aangemaakt ' + esc(datumKort(b.created_at)) + '.' : ''}</p>
        </aside>
      </form>
    </div>
  </main>
  ${voet()}`);

  const form = document.getElementById('editorform');
  const zet = (pad, waarde) => { const el = form.querySelector(`[data-pad="${pad}"]`); if (el) el.value = waarde; };

  form.addEventListener('input', e => {
    const el = e.target; const pad = el.dataset.pad; if (!pad) return;
    const waarde = el.type === 'checkbox' ? el.checked : el.value;
    schrijf(bewerk, pad, waarde);

    if (pad === 'slug') { slugHandmatig = true; toonSlugFout(''); }
    if (pad === 'content.klantnaam') {
      if (!slugHandmatig) { bewerk.slug = slugVoorKlant(waarde); zet('slug', bewerk.slug); toonSlugFout(''); }
      if (!heeftTekst(bewerk.content.over.kop) || bewerk.content.over.kop === 'Over ' + vorigeKlant) {
        bewerk.content.over.kop = waarde ? 'Over ' + waarde : ''; zet('content.over.kop', bewerk.content.over.kop);
      }
      vorigeKlant = waarde;
      document.getElementById('editorkop').textContent = nieuw ? 'Nieuwe case' : (waarde || 'Case bewerken');
      const kl = form.querySelector('[data-kaart="klant"]'); if (kl) kl.textContent = waarde || '[klantnaam]';
    }
    if (pad === 'content.dienst' || pad === 'content.branche') {
      const labelVeld = form.querySelector('[data-pad="content.hero.label"]');
      if (labelVeld) { labelVeld.placeholder = autoLabel(bewerk.content) || 'DIENST · BRANCHE'; labelVeld.parentElement.querySelector('.veld__hint').textContent = 'Leeg = automatisch uit dienst en branche: ' + (autoLabel(bewerk.content) || '…'); }
      const d = form.querySelector('[data-kaart="dienst"]'); if (d) d.textContent = bewerk.content.dienst;
    }
    if (pad === 'content.locatie') { const l = form.querySelector('[data-kaart="locatie"]'); if (l) l.textContent = waarde; }
    if (pad === 'content.kaart.samenvatting' || pad === 'content.inleiding') {
      const s = form.querySelector('[data-kaart="samenvatting"]'); if (s) s.textContent = samenvatting(bewerk.content) || '[korte samenvatting]';
    }
    if (pad.endsWith('.afbeelding')) {
      const vak = form.querySelector(`[data-voorbeeld="${pad}"]`);
      if (vak) vak.innerHTML = waarde ? `<img src="${esc(waarde)}" alt="">` : '<span class="veld__hint">Nog geen afbeelding.</span>';
    }
    if (pad === 'published' || pad === 'content.citaat.tonen') tekenEditor();
  });

  form.addEventListener('click', e => {
    const knop = e.target.closest('[data-actie]'); if (!knop) return;
    const actie = knop.dataset.actie;
    if (actie === 'voeg-item') {
      const lijst = lees(bewerk, knop.dataset.lijst);
      if (knop.dataset.lijst === 'content.kerncijfers') { if (lijst.length < 4) lijst.push({ label: '', getal: '', eenheid: '' }); }
      else lijst.push('');
      tekenEditor();
      app.querySelector(`[data-lijst="${knop.dataset.lijst}"] .herhaal__rij:last-of-type input`)?.focus();
    }
    if (actie === 'verwijder-item') {
      const lijst = lees(bewerk, knop.dataset.lijst);
      if (knop.dataset.lijst === 'content.kerncijfers' && lijst.length <= 2) return;
      lijst.splice(Number(knop.dataset.index), 1);
      tekenEditor();
    }
    if (actie === 'opslaan-sluiten') slaOp(true);
  });

  form.addEventListener('submit', e => { e.preventDefault(); slaOp(false); });
}

function toonSlugFout(tekst) {
  const el = document.getElementById('slugfout'); if (el) el.textContent = tekst;
  document.getElementById('slugfout-veld')?.classList.toggle('veld--fout', !!tekst);
  if (tekst) document.querySelector('details.sectie[data-sectie="1"]')?.setAttribute('open', '');
}

async function slaOp(sluiten) {
  if (opslaanBezig) return;
  const m = document.getElementById('editormelding');
  const zegt = (tekst, fout = false) => { m.textContent = tekst; m.classList.toggle('melding--fout', fout); };
  const k = bewerk.content;

  const fouten = [];
  if (!heeftTekst(k.titel)) fouten.push('een casetitel');
  if (!heeftTekst(k.klantnaam)) fouten.push('een klantnaam');
  if (!heeftTekst(bewerk.slug)) bewerk.slug = slugVoorKlant(k.klantnaam);
  const kern = slugify(bewerk.slug.replace(/^case-/, ''));
  bewerk.slug = kern ? 'case-' + kern : '';
  if (!heeftTekst(bewerk.slug)) fouten.push('een slug');
  if (fouten.length) { zegt('Nog nodig: ' + fouten.join(', ') + '.', true); return; }
  if (!heeftTekst(k.over.kop) && heeftTekst(k.over.body)) k.over.kop = 'Over ' + k.klantnaam;
  const slugVeld = document.querySelector('[data-pad="slug"]'); if (slugVeld) slugVeld.value = bewerk.slug;
  toonSlugFout('');

  const knoppen = [...document.querySelectorAll('.editor__zij .knop')];
  opslaanBezig = true; knoppen.forEach(b => b.setAttribute('aria-disabled', 'true'));
  zegt('Opslaan…');
  try {
    const rijen = bewerk.id == null
      ? await db.maak(bewerk)
      : await db.werkBij(bewerk.id, payload(bewerk));
    if (!Array.isArray(rijen) || !rijen[0]) throw new ApiFout(200, 'De database gaf geen opgeslagen rij terug.');
    const rij = normaliseer(rijen[0]);
    vervangInLijst(rij);
    const wasNieuw = bewerk.id == null;
    bewerk = JSON.parse(JSON.stringify(rij));
    bewerk.content.gerelateerd = [bewerk.content.gerelateerd[0] || '', bewerk.content.gerelateerd[1] || ''];
    while (bewerk.content.kerncijfers.length < 2) bewerk.content.kerncijfers.push({ label: '', getal: '', eenheid: '' });
    nieuw = false;
    if (sluiten) { location.hash = '#/'; return; }
    if (wasNieuw) history.replaceState(null, '', '#/bewerk/' + rij.id);
    tekenEditor();
    document.getElementById('editormelding').textContent = `Opgeslagen om ${new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })}.`;
  } catch (e) {
    if (e instanceof ApiFout && e.status === 409) {
      toonSlugFout('Deze slug is al in gebruik.');
      zegt('Niet opgeslagen: de slug bestaat al. Pas hem aan bij Basis.', true);
    } else {
      zegt('Opslaan is mislukt: ' + foutTekst(e), true);
    }
  } finally {
    opslaanBezig = false;
    document.querySelectorAll('.editor__zij .knop').forEach(b => b.removeAttribute('aria-disabled'));
  }
}

/* Start */
route();
</script>
</body>
</html>
